name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 https://elis-api.onrender.com/health && exit 0
            sleep 10
          done
          exit 1
